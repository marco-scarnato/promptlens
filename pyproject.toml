[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "promptguard"
requires-python = ">=3.8"
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "promptguard._core"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
